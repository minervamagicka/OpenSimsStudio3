# Builds the whole solution and runs the pure-code tests on every push and pull request.
# The app and the Probe checks need a Windows install of The Sims 3, so they are not run here.
name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build OpenSimsStudio3.sln -c Release
      - run: dotnet test tests/OpenSimsStudio3.Tests -c Release --no-build
